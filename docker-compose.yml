# Local services for ClipCraft.
#
#   docker compose up -d          # start MongoDB + Redis
#   docker compose ps             # check they are healthy
#   docker compose down           # stop (data survives in the named volumes)
#
# Then in .env.local:
#   MONGODB_URI=mongodb://127.0.0.1:27017
#   REDIS_URL=redis://127.0.0.1:6379
#
# Inside WSL2 use 127.0.0.1 (not `localhost`) so the Mongo driver does not try IPv6.
services:
  mongo:
    image: mongo:7
    container_name: clipcraft-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - clipcraft_mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: clipcraft-redis
    restart: unless-stopped
    # BullMQ requires Redis >= 6.2 and needs appendonly for durable job state.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - clipcraft_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  clipcraft_mongo:
  clipcraft_redis:
